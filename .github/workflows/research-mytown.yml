name: Research MyTown PA coverage (one-off)
on:
  push:
    paths: ["research/mytown_pa.py"]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python research/mytown_pa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research/out
          git commit -m "MyTown PA research output" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
