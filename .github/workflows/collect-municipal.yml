name: Collect municipal documents
on:
  schedule:
    - cron: "17 10 * * *"   # daily, ~6:17am Eastern
  workflow_dispatch:
  push:
    paths: ["collectors/**", ".github/workflows/collect-municipal.yml"]
permissions:
  contents: write
concurrency:
  group: collect-municipal
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 pypdf
      - run: python collectors/civicplus.py
      - name: Save collected documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Collect municipal documents $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
