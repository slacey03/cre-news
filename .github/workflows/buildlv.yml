name: BuildLV market stats
on:
  workflow_dispatch:
  schedule:
    - cron: "43 11 * * *"   # daily; LVPC posts one report a month
  push:
    branches: [main]
    paths: ["tools/buildlv_stats.py"]
concurrency: { group: buildlv, cancel-in-progress: false }
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y poppler-utils >/dev/null && pip install requests beautifulsoup4 pypdf pdf2image anthropic "psycopg[binary]"
      - run: python tools/buildlv_stats.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
