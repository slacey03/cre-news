name: LVPC sitemap probe (one-off)
on:
  push:
    branches: [main]
    paths: ["tools/lvpc_sitemap_probe.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4 pypdf && python tools/lvpc_sitemap_probe.py
