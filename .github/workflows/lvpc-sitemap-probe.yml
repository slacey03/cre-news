name: LVPC sitemap probe (one-off)
on:
  push:
    branches: [main]
    paths: ["tools/lvpc_sitemap_probe.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y tesseract-ocr poppler-utils >/dev/null && pip install requests beautifulsoup4 pypdf pdf2image pytesseract && python tools/lvpc_sitemap_probe.py
