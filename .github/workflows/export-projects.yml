name: Export projects (one-off)
on:
  push:
    branches: [main]
    paths: ["tools/export_projects.py"]
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "psycopg[binary]" && python tools/export_projects.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
