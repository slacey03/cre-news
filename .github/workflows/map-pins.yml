name: Map pins
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/geocode.py"]
jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "psycopg[binary]" requests
      - name: Put map pins on projects (free Census geocoder)
        run: python tools/geocode.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
