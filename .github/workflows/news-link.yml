name: News linking
on:
  workflow_dispatch:
    inputs:
      args: { default: "80" }
  schedule:
    - cron: "23 13 * * 1"   # weekly (Monday): new notable projects + 30-day re-check of active ones
  push:
    branches: [main]
    paths: ["tools/news_link.py"]
concurrency: { group: news-link, cancel-in-progress: false }
jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 pypdf anthropic "psycopg[binary]"
      - name: Search news for notable projects (exact address only)
        run: python tools/news_link.py ${{ inputs.args || (github.event_name == 'push' && 'reverify unverified') || '80' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Re-check links that could not be verified before (hidden until they pass)
        if: always()
        run: python tools/news_link.py reverify unverified
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Attach linked news to projects (dashboard)
        if: always()
        run: python tools/link_projects.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
