name: AI extraction
on:
  workflow_dispatch:
    inputs:
      mode: { default: "trial" }
      limit: { default: "20" }
  push:
    branches: [main]
    paths: ["tools/extract.py"]
concurrency: { group: extract, cancel-in-progress: false }
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "psycopg[binary]" anthropic
      - run: python tools/extract.py ${{ inputs.mode || 'trial' }} ${{ inputs.limit || '20' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
