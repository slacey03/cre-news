name: AI extraction
on:
  workflow_dispatch:
    inputs:
      mode: { default: "batch" }
      limit: { default: "1000" }
  push:
    branches: [main]
    paths: ["tools/extract.py", "tools/link_projects.py", "tools/geocode.py", "db/**"]
  workflow_run:
    workflows: ["Load Supabase"]
    types: [completed]
concurrency: { group: extract, cancel-in-progress: false }
jobs:
  extract:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "psycopg[binary]" anthropic
      - run: python tools/extract.py ${{ inputs.mode || 'batch' }} ${{ inputs.limit || '1000' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WAIT_MIN: "55"
      - name: Link mentions into one record per project
        run: python tools/link_projects.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Map pins (Census geocoder, exact address matches only)
        run: pip install requests && python tools/geocode.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
