name: Cost report
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/costs.py"]
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "psycopg[binary]"
      - name: AI reading cost from the database
        run: python tools/costs.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: News linking and BuildLV cost from run logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for w in news-link.yml buildlv.yml; do
            for id in $(gh run list -R "$GITHUB_REPOSITORY" -w $w -L 500 --json databaseId -q '.[].databaseId'); do
              d=$(gh run view $id -R "$GITHUB_REPOSITORY" --json createdAt -q .createdAt | cut -c1-7)
              c=$(gh run view $id -R "$GITHUB_REPOSITORY" --log 2>/dev/null | grep -oE '= \$[0-9]+\.[0-9]+' | tail -1 | tr -d '= $')
              [ -n "$c" ] && echo "RUN $w $d $c"
            done
          done
